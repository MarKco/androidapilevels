plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
}

// Leggi le proprietà di firma da local.properties
import java.util.Properties
import java.io.FileInputStream

Properties localProps = new Properties()
File localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}
def hasSigning = localProps['RELEASE_STORE_FILE'] && localProps['RELEASE_KEY_ALIAS'] && localProps['RELEASE_STORE_PASSWORD'] && localProps['RELEASE_KEY_PASSWORD']

android {
    compileSdk 36

    defaultConfig {
        applicationId "it.marcozanetti.androidapilevels"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 14
        versionName "14"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        compose true
    }

    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(localProps['RELEASE_STORE_FILE'])
                storePassword localProps['RELEASE_STORE_PASSWORD']
                keyAlias localProps['RELEASE_KEY_ALIAS']
                keyPassword localProps['RELEASE_KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlin {
        compilerOptions {
            jvmTarget = "JVM_17"
        }
    }
    
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }
    
    namespace 'it.marcozanetti.androidapilevels'

    lint {
        disable "MutableCollectionMutableState"
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.18.0'
    // Compose
    implementation "androidx.activity:activity-compose:1.13.0"
    implementation "androidx.compose.ui:ui:1.10.5"
    implementation "androidx.compose.material:material:1.10.5"
    implementation "androidx.compose.material:material-icons-core:1.7.8"
    implementation "androidx.compose.ui:ui-tooling-preview:1.10.5"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.10.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0"
    implementation "androidx.navigation:navigation-compose:2.9.7"
    debugImplementation "androidx.compose.ui:ui-tooling:1.10.5"
    debugImplementation "androidx.compose.ui:ui-test-manifest:1.10.5"
    // TESTS
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.0'
    androidTestImplementation "androidx.arch.core:core-testing:2.2.0"
    // Compose UI test dependencies
    androidTestImplementation "androidx.compose.ui:ui-test-junit4:1.10.5"
    implementation "androidx.compose.ui:ui-test-junit4:1.10.5" // Optional, for unit tests
    // Networking
    implementation "com.squareup.retrofit2:retrofit:3.0.0"
    implementation "com.squareup.retrofit2:converter-moshi:3.0.0"
    ksp 'com.squareup.moshi:moshi-kotlin-codegen:1.15.2'
    implementation 'com.squareup.retrofit2:converter-scalars:3.0.0'
    implementation 'org.jsoup:jsoup:1.22.1'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.3.2'
    // Progress bar (SpinKit) - optional, if used in Compose
    implementation 'com.github.ybq:Android-SpinKit:1.4.0'
    // TESTS
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.0'
    androidTestImplementation "androidx.arch.core:core-testing:2.2.0"
}

tasks.register("generateIcons", Exec) {
    workingDir rootProject.projectDir
    commandLine 'python3', 'scripts/generate_dynamic_launcher_icons.py'
}
